server:
  port: 8082
  wait-time-in-ms-when-sync-empty: 3000

spring:
  mongodb:
    host: 127.0.0.1
    port: 27017
    database: produto
    authentication-database: admin
    username: ${MONGO_INITDB_ROOT_USERNAME}
    password: ${MONGO_INITDB_ROOT_PASSWORD}
  data:
    mongodb:
      auto-index-creation: true

application-version: 1.0