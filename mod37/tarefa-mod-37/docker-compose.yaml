services:
  postgres:
    image: postgres:17
    container_name: filme-postgres
    environment:
      POSTGRES_DB: postgresmovdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
